<title>Бархатный вечер — романтическая игра</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--ink:#f7f0e9;--muted:#b9afb8;--bg:#11101a;--panel:#1b1925;--pink:#f5a1b5;--gold:#e9c78e;--line:#ffffff20;--mint:#9ed8c3;--shadow:0 24px 80px #08070db0}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 4%,#392535 0,transparent 35%),radial-gradient(ellipse at 4% 92%,#202e34 0,transparent 32%),var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.shell{max-width:1180px;margin:auto;padding:22px clamp(16px,4vw,48px) 36px;min-height:100vh;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:11px;font-size:12px;text-transform:uppercase;letter-spacing:.22em;color:#e3d6d2}.brand-mark{width:32px;height:32px;border:1px solid #e6a1b277;border-radius:50%;display:grid;place-items:center;color:var(--pink);font-family:serif;font-size:19px}.top-note{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b9aab5;border:1px solid var(--line);border-radius:100px;padding:8px 12px}.main{flex:1;display:grid;place-items:center}.game{width:100%;max-width:1050px;min-height:580px;border:1px solid #ffffff1b;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#24212de8,#17151fee);box-shadow:var(--shadow);display:grid;grid-template-columns: .92fr 1.08fr;position:relative}.art{position:relative;min-height:580px;overflow:hidden;background:linear-gradient(180deg,#30273e,#171923 70%)}.art:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 46%,#13121bd9 100%),radial-gradient(ellipse at 50% 30%,#ee9d9a30,transparent 48%)}.moon{position:absolute;width:100px;height:100px;right:15%;top:13%;border-radius:50%;background:#ffe5c7;box-shadow:0 0 42px #fbc9ac55;opacity:.8}.city{position:absolute;bottom:0;left:0;right:0;height:41%;background:repeating-linear-gradient(90deg,transparent 0 7%,#171721 7% 9%,transparent 9% 12%),linear-gradient(0deg,#101119 0 24%,transparent 24%)}.city:before{content:'';position:absolute;inset:35% 0 0;background:repeating-linear-gradient(90deg,#f6bd8244 0 2px,transparent 2px 27px);mask-image:linear-gradient(0deg,#000,transparent)}.roof{position:absolute;bottom:0;left:0;right:0;height:20%;background:linear-gradient(165deg,#262532,#101118 75%);clip-path:polygon(0 26%,100% 0,100% 100%,0 100%)}.plant{position:absolute;bottom:15%;left:10%;width:105px;height:200px;opacity:.85}.plant i{position:absolute;bottom:10px;left:50%;width:4px;height:150px;background:#546f62;transform-origin:bottom;border-radius:4px}.plant i:before{content:'';position:absolute;width:31px;height:58px;background:linear-gradient(135deg,#648c70,#263b3c);border-radius:100% 0 100% 0;top:14px;left:-26px;transform:rotate(-25deg)}.plant i:nth-child(1){transform:rotate(-35deg)}.plant i:nth-child(2){transform:rotate(-15deg);height:180px}.plant i:nth-child(3){transform:rotate(15deg);height:170px}.plant i:nth-child(4){transform:rotate(35deg);height:135px}.table{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);width:190px;height:72px;border-radius:50%;background:linear-gradient(180deg,#39303a,#201d27);border:1px solid #ffffff30;box-shadow:0 13px 15px #0007}.table:after{content:'';position:absolute;width:8px;height:72px;background:#28232d;left:calc(50% - 4px);top:45px}.glass{position:absolute;bottom:30%;left:calc(50% + 33px);width:20px;height:30px;border:1px solid #e7c99caa;border-top:0;border-radius:0 0 7px 7px;z-index:2}.glass:before{content:'';position:absolute;top:7px;left:1px;right:1px;height:1px;background:#e8c995}.glow{position:absolute;bottom:29%;left:calc(50% - 50px);width:14px;height:14px;background:#ffc58c;border-radius:50%;filter:blur(7px);box-shadow:0 0 24px 9px #e9a47585;z-index:2}.figure{position:absolute;bottom:21%;left:50%;transform:translateX(-50%);width:148px;height:260px;z-index:3;transition:filter .4s}.figure .hair{position:absolute;top:1px;left:26px;width:98px;height:126px;border-radius:52% 48% 42% 42%;background:linear-gradient(115deg,#241a27,#523447 57%,#261c28);z-index:2}.figure .face{position:absolute;top:30px;left:43px;width:68px;height:87px;border-radius:45% 45% 48% 48%;background:linear-gradient(100deg,#c98975,#ebba9e 70%,#b87368);z-index:3}.figure .face:after{content:'·  ·';position:absolute;left:19px;top:32px;letter-spacing:13px;font-size:15px;color:#402933}.figure .neck{position:absolute;top:98px;left:68px;width:25px;height:32px;background:#ce917e;z-index:2}.figure .body{position:absolute;top:115px;left:18px;width:112px;height:145px;border-radius:52px 52px 12px 12px;background:linear-gradient(100deg,#594257,#aa6579 55%,#6e4058);z-index:1}.figure .body:after{content:'';position:absolute;top:13px;left:48px;width:1px;height:94px;background:#ffffff30}.figure .hair-back{position:absolute;top:15px;left:22px;width:104px;height:150px;border-radius:50% 50% 26% 26%;background:#362438;z-index:0}.figure .earring{position:absolute;top:91px;left:108px;width:7px;height:15px;border:1px solid var(--gold);border-radius:50%;z-index:4}.figure.smile{filter:drop-shadow(0 0 15px #f2b7ae33)}.art-label{position:absolute;z-index:5;left:28px;bottom:25px}.art-label small{display:block;color:#d4b8b7;text-transform:uppercase;letter-spacing:.2em;font-size:10px;margin-bottom:6px}.art-label strong{font:500 27px 'Playfair Display',serif}.content{padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;justify-content:center;position:relative}.eyebrow{display:flex;align-items:center;gap:9px;color:var(--pink);font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:13px}.eyebrow:before{content:'';width:19px;height:1px;background:currentColor}h1,h2{font-family:'Playfair Display',serif;font-weight:500;line-height:1.13;margin:0}h1{font-size:clamp(36px,5vw,58px);letter-spacing:-.03em}h2{font-size:clamp(28px,4vw,40px)}.intro{color:#c9bdc4;line-height:1.75;font-size:14px;max-width:460px;margin:17px 0 23px}.fine{font-size:11px;color:#9e929c;line-height:1.6}.primary,.choice,.text-button{border:0;cursor:pointer;transition:transform .18s,background .18s,border-color .18s}.primary{background:var(--pink);color:#281821;border-radius:100px;padding:14px 22px;font-weight:700;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 7px 24px #e99cad24}.primary:hover{background:#ffb6c4;transform:translateY(-2px)}.entry-actions{display:flex;align-items:center;gap:17px;flex-wrap:wrap}.text-button{background:none;color:#b9afb8;text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:8px}.text-button:hover{color:white}.age-check{display:flex;gap:10px;align-items:flex-start;margin:3px 0 18px;font-size:12px;color:#c5b8c0;line-height:1.5}.age-check input{accent-color:var(--pink);width:16px;height:16px;margin:1px 0 0}.hidden{display:none!important}.scene-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.chapter{color:#a89ca8;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.turn{color:#9e929c;font-size:11px}.meters{display:flex;gap:9px;margin:4px 0 23px}.meter{flex:1;min-width:0;background:#ffffff08;border:1px solid #ffffff13;border-radius:12px;padding:11px 12px}.meter-head{display:flex;justify-content:space-between;gap:4px;font-size:10px;color:#bfb1bc;margin-bottom:7px}.meter-head b{font-weight:600;color:var(--ink)}.track{height:4px;background:#ffffff15;border-radius:6px;overflow:hidden}.fill{height:100%;width:50%;background:var(--pink);border-radius:6px;transition:width .5s}.fill.trust{background:var(--mint)}.fill.chemistry{background:var(--gold)}.scene-illustration{height:92px;margin:-10px 0 17px;border:1px solid #ffffff14;border-radius:12px;background:linear-gradient(110deg,#f5a1b50c,#e9c78e0d);display:grid;place-items:center;overflow:hidden}.scene-illustration svg{width:min(100%,300px);height:100%;display:block}.dialogue{font:500 clamp(18px,2.4vw,23px)/1.5 'Playfair Display',serif;color:#f5e8e4;margin:0 0 8px}.narration{font-size:13px;color:#bcb0b8;line-height:1.72;margin:0 0 18px}.prompt{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#c7a6b0;margin:0 0 10px}.choices{display:grid;gap:9px}.choice{width:100%;text-align:left;border:1px solid #ffffff1c;background:#ffffff06;padding:13px 15px;border-radius:12px;line-height:1.45;font-size:13px;color:#e8dfe4;display:flex;align-items:flex-start;gap:11px}.choice:hover{border-color:#f5a1b577;background:#f5a1b50c;transform:translateX(3px)}.choice .num{color:var(--pink);font-size:10px;font-weight:700;min-width:16px;padding-top:2px}.choice small{display:block;color:#a89da6;font-size:11px;margin-top:3px}.statusline{margin-top:16px;min-height:16px;color:#b8d5c9;font-size:11px}.end-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.secondary{border:1px solid #ffffff30;background:#ffffff08;color:#eee0e5;border-radius:100px;padding:12px 17px;cursor:pointer}.secondary:hover{border-color:var(--pink)}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:17px;color:#8e838d;font-size:10px}.footer span:last-child{letter-spacing:.08em}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#292633;border:1px solid #ffffff20;border-radius:100px;padding:10px 15px;font-size:12px;opacity:0;pointer-events:none;transition:.3s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.shell{padding:14px 12px 18px}.topbar{margin-bottom:13px}.game{grid-template-columns:1fr;min-height:0;border-radius:17px}.art{min-height:280px;max-height:34vh}.moon{width:68px;height:68px;top:10%;right:18%}.plant{transform:scale(.7);transform-origin:bottom left;bottom:10%}.figure{transform:translateX(-50%) scale(.72);transform-origin:bottom center;bottom:8%}.table{bottom:8%;transform:translateX(-50%) scale(.75)}.glass{bottom:20%}.glow{bottom:19%}.city{height:52%}.roof{height:24%}.art-label{left:18px;bottom:13px}.art-label strong{font-size:21px}.content{padding:22px 18px 24px}.meters{margin-bottom:17px}.dialogue{font-size:20px}.narration{margin-bottom:13px}.choice{padding:12px}.footer{margin-top:12px}.top-note{font-size:9px;padding:7px 9px}.brand{font-size:10px}.brand-mark{width:28px;height:28px}}
@media(max-width:380px){.meters{gap:5px}.meter{padding:9px 7px}.meter-head{font-size:9px}.content{padding:19px 15px}.art{min-height:240px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="brand"><div class="brand-mark">✦</div> Бархатный вечер</div><div class="top-note">Романтическая история · 18+</div></header>
  <main class="main"><section class="game" aria-live="polite">
    <div class="art" aria-label="Иллюстрация ночной террасы с видом на город"><div class="moon"></div><div class="city"></div><div class="roof"></div><div class="plant"><i></i><i></i><i></i><i></i></div><div class="figure" id="figure"><div class="hair-back"></div><div class="hair"></div><div class="face"></div><div class="neck"></div><div class="body"></div><div class="earring"></div></div><div class="table"></div><div class="glass"></div><div class="glow"></div><div class="art-label"><small>Сегодня рядом</small><strong>Роуэн, 29</strong></div></div>
    <div class="content" id="content"></div>
  </section></main>
  <footer class="footer"><span>Вымышленные взрослые персонажи · взаимное согласие</span><span>БАРХАТНЫЙ ВЕЧЕР&nbsp; / &nbsp;01</span></footer>
</div><div class="toast" id="toast" role="status"></div>
<script>
const content=document.getElementById('content');
const figure=document.getElementById('figure');
const toastEl=document.getElementById('toast');
let state={turn:0,trust:2,chemistry:2,comfort:2};
const startMarkup=`<div class="eyebrow">Немного после полуночи</div><h1>Некоторые ночи<br>созданы для<br>сближения.</h1><p class="intro">Терраса на крыше, тёплый напиток и загадочный незнакомец. Проведите вечер с Роуэн в короткой романтической истории о симпатии, искренности и удовольствии не торопиться.</p><label class="age-check"><input type="checkbox" id="adultCheck"><span>Мне уже исполнилось 18 лет. Я понимаю, что это вымышленная романтическая игра без откровенных сцен.</span></label><div class="entry-actions"><button class="primary" id="begin" disabled>Начать вечер <span aria-hidden="true">↗</span></button><button class="text-button" id="about">Что это за игра?</button></div><p class="fine" style="margin-top:18px">Все персонажи — взрослые. Любая близость необязательна, взаимна и остаётся за кадром.</p>`;
const chapters=[
 {title:'Первая искра',line:'«Я рада, что ты пришёл. Обычно это место — мой маленький секрет». Роуэн улыбается и показывает на свободное кресло. «Каким ты представлял этот вечер?»',desc:'С террасы доносится аромат жасмина. Роуэн смотрит на тебя с неподдельным интересом.',prompt:'Задай настроение вечеру',illustration:'<svg viewBox="0 0 240 110" role="img" aria-label="Ночной город и луна"><circle cx="186" cy="28" r="17" fill="#f9d9b4"/><path d="M0 82 31 58l25 16 32-35 33 35 27-21 25 24 28-36 39 29v40H0Z" fill="#373047"/><path d="M0 94h240v16H0z" fill="#211e2c"/><path d="M48 75h7v4h-7zm72-8h7v4h-7zm54 13h7v4h-7zm40-19h7v4h-7z" fill="#f3bb84"/></svg>',choices:[
  {label:'«Хороший разговор и никакой спешки».',sub:'Спокойное начало · растёт доверие',d:[2,1,2],note:'Роуэн расслабляется: «Вот такой темп мне нравится».'},
  {label:'«Удиви меня. За что ты любишь это место?»',sub:'Любопытство и внимание · сближает',d:[1,2,1],note:'Роуэн оживляется и рассказывает, как однажды нашёл эту террасу.'},
  {label:'«Я бы немного пофлиртовал, если ты не против».',sub:'Открыто и с уважением к ответу',d:[1,2,1],note:'«Я не против», — с улыбкой отвечает Роуэн. «Спасибо, что спросил».'}]},
 {title:'Хороший вопрос',line:'Разговор становится непринуждённым. Роуэн реставрирует старые фотографии и собирает истории попутчиков в поездах.',desc:'«Мне нравятся моменты, когда люди перестают притворяться», — говорит Роуэн. «А что помогает тебе быть собой?»',prompt:'Поделись чем-нибудь',illustration:'<svg viewBox="0 0 240 110" role="img" aria-label="Старинные фотографии"><rect x="33" y="17" width="78" height="70" rx="5" fill="#ead5bc" transform="rotate(-10 33 17)"/><rect x="44" y="27" width="56" height="43" fill="#687780" transform="rotate(-10 44 27)"/><circle cx="70" cy="42" r="10" fill="#efc18f"/><path d="M50 64 66 49l10 9 9-7 14 15z" fill="#34444c"/><rect x="126" y="24" width="77" height="65" rx="5" fill="#edc9a9" transform="rotate(8 126 24)"/><rect x="137" y="33" width="55" height="40" fill="#a16f68" transform="rotate(8 137 33)"/><circle cx="162" cy="47" r="9" fill="#f5d09c"/><path d="m141 68 18-15 10 8 8-5 12 16z" fill="#44504c"/></svg>',choices:[
  {label:'Рассказать о маленькой вещи, которая радует.',sub:'Личное, но без лишнего давления · доверие',d:[2,1,1],note:'Роуэн слушает очень внимательно и делится своей маленькой радостью.'},
  {label:'Спросить, чему Роуэн хотел бы уделять больше времени.',sub:'Внимательный вопрос · сближает',d:[1,2,1],note:'Ответ превращается в историю, которую не хочется прерывать.'},
  {label:'«Мне с тобой хорошо. Присядем чуть ближе?»',sub:'Сначала спросить — это важно',d:[1,2,2],note:'«Да, давай». Роуэн пересаживается поближе, оставляя вам обоим пространство.'}]},
 {title:'Тихая пауза',line:'Вечерняя мелодия плывёт над крышей. Рука Роуэна лежит рядом с твоей на столе — не касаясь, просто близко.',desc:'В этой паузе много возможностей. Здесь нет неправильного ответа.',prompt:'Выбери, как тебе комфортно',illustration:'<svg viewBox="0 0 240 110" role="img" aria-label="Музыка и свечи"><path d="M27 29c26-20 41 13 65-2s39 16 61-1 35 5 60-7" fill="none" stroke="#e9a1b5" stroke-width="3" stroke-linecap="round"/><path d="M72 55h24l-4 30H77zm6 31h12v5H78zM145 48h26l-5 37h-16zm7 39h12v5h-12z" fill="#f3d9ce" opacity=".8"/><path d="M80 68h9m68-7h10" stroke="#e4a77d" stroke-width="3"/><circle cx="120" cy="27" r="6" fill="#f7cb8d"/><path d="M120 32v24" stroke="#f7cb8d" stroke-width="2" opacity=".6"/></svg>',choices:[
  {label:'Протянуть руку, оставляя решение Роуэну.',sub:'Ясное приглашение и право выбора',d:[2,1,2],note:'Роуэн отвечает на жест. Прикосновение тёплое, лёгкое и взаимное.'},
  {label:'Продолжить разговор: сейчас это самое приятное.',sub:'Близость не обязана торопиться',d:[2,1,2],note:'Вы оба смеётесь, и непринуждённая беседа становится особенной.'},
  {label:'Спросить, не потанцевать ли вместе.',sub:'Приглашение без ожиданий',d:[1,2,1],note:'«С удовольствием». Вы медленно кружитесь под огнями ночного города.'}]},
 {title:'Ещё одно мгновение',line:'Ночь стала мягче и тише. Роуэн смотрит на тебя тепло и спокойно.',desc:'«Мне было очень хорошо», — говорит Роуэн. «Продолжим вечер или оставим его таким — прекрасным?»',prompt:'Этот вечер — твой выбор',illustration:'<svg viewBox="0 0 240 110" role="img" aria-label="Прогулка под звёздным небом"><circle cx="189" cy="25" r="15" fill="#f8dcb9"/><circle cx="45" cy="22" r="2" fill="#fff0cf"/><circle cx="91" cy="16" r="2" fill="#fff0cf"/><circle cx="146" cy="39" r="2" fill="#fff0cf"/><path d="M0 90q35-25 71 0t72 0 97 0v20H0z" fill="#35473f"/><circle cx="98" cy="47" r="10" fill="#d99a80"/><path d="M87 59h23l11 35H81z" fill="#b76e80"/><circle cx="144" cy="49" r="10" fill="#edb394"/><path d="M133 61h23l7 33h-36z" fill="#637f7a"/><path d="m103 92 14 12m34-12-10 12" stroke="#dbb68e" stroke-width="5" stroke-linecap="round"/></svg>',choices:[
  {label:'Предложить встретиться снова — теперь днём.',sub:'Оставить место для продолжения',d:[2,1,2],note:'«Мне бы этого хотелось», — улыбается Роуэн.'},
  {label:'Предложить ещё немного прогуляться вместе.',sub:'Побыть рядом ещё немного, без спешки',d:[1,2,1],note:'Роуэн кивает. Вы выходите в прохладную ночь рядом друг с другом.'},
  {label:'Поблагодарить за вечер и попрощаться.',sub:'Красивый финал — тоже финал',d:[2,1,2],note:'«Я рад нашей встрече», — говорит Роуэн. Вы расходитесь с улыбкой.'}]}
];
function renderStart(){content.innerHTML=startMarkup;const check=document.getElementById('adultCheck'),begin=document.getElementById('begin');check.addEventListener('change',()=>begin.disabled=!check.checked);begin.addEventListener('click',()=>{if(check.checked){state={turn:0,trust:2,chemistry:2,comfort:2};renderScene()}});document.getElementById('about').addEventListener('click',()=>toast('Романтическая история о взаимном согласии. Без откровенных сцен.'));}
function renderMeters(){const values=[['Доверие',state.trust,'trust'],['Искра',state.chemistry,'chemistry'],['Комфорт',state.comfort,'']];return `<div class="meters">${values.map(([name,val,cls])=>`<div class="meter"><div class="meter-head"><span>${name}</span><b>${Math.min(5,val)}/5</b></div><div class="track"><div class="fill ${cls}" style="width:${Math.min(100,val*20)}%"></div></div></div>`).join('')}</div>`}
function renderScene(){const c=chapters[state.turn];figure.classList.toggle('smile',state.chemistry>=4);content.innerHTML=`<div class="scene-top"><span class="chapter">${c.title}</span><span class="turn">${state.turn+1} / ${chapters.length}</span></div>${renderMeters()}<div class="scene-illustration">${c.illustration}</div><p class="dialogue">${c.line}</p><p class="narration">${c.desc}</p><p class="prompt">${c.prompt}</p><div class="choices">${c.choices.map((choice,i)=>`<button class="choice" data-choice="${i}"><span class="num">0${i+1}</span><span>${choice.label}<small>${choice.sub}</small></span></button>`).join('')}</div><div class="statusline" id="statusline"></div>`;content.querySelectorAll('.choice').forEach(button=>button.addEventListener('click',()=>selectChoice(Number(button.dataset.choice))));}
function selectChoice(index){const c=chapters[state.turn],choice=c.choices[index];state.trust=Math.max(0,Math.min(5,state.trust+choice.d[0]-1));state.chemistry=Math.max(0,Math.min(5,state.chemistry+choice.d[1]-1));state.comfort=Math.max(0,Math.min(5,state.comfort+choice.d[2]-1));figure.classList.toggle('smile',state.chemistry>=4);const line=document.getElementById('statusline');line.textContent=choice.note;content.querySelectorAll('.choice').forEach(b=>b.disabled=true);setTimeout(()=>{state.turn++;state.turn<chapters.length?renderScene():renderEnding()},1050)}
function renderEnding(){let title,copy,extra;if(state.trust>=4&&state.comfort>=4&&state.chemistry>=4){title='Ночь, которую запомнишь';copy='В мягком свете города вы целуетесь — нежно и по взаимному желанию. Вечер заканчивается спокойно, на твоих условиях, с обещанием увидеться снова. А продолжение истории решать только вам.';extra='Редкая близость: тёплая, искренняя и только ваша.'}else if(state.trust>=4&&state.comfort>=4){title='Не спеша';copy='Вы обмениваетесь номерами и договариваетесь встретиться снова. Необязательно торопить события: на сегодня достаточно обещания узнать друг друга получше.';extra='Доверие помогло вырасти чему-то прекрасному.'}else if(state.chemistry>=5){title='Яркая искра';copy='Вы весело прощаетесь, оставляя возможность встретиться ещё раз. Что бы ни было дальше, каждый момент вы выбирали вместе и честно.';extra='Искра — это начало, а не обещание.'}else{title='Прекрасный вечер';copy='Ты прощаешься с лёгким сердцем. Не всякое знакомство должно стать романом: иногда добрый разговор — уже целый подарок.';extra='Ты провёл этот вечер так, как хотел.'}figure.classList.toggle('smile',state.chemistry>=5);content.innerHTML=`<div class="eyebrow">Вечер подходит к концу</div><h2>${title}</h2><p class="intro">${copy}</p><p class="fine">${extra}</p>${renderMeters()}<div class="end-actions"><button class="primary" id="again">Сыграть ещё раз <span aria-hidden="true">↻</span></button><button class="secondary" id="restart">К началу</button></div><p class="fine" style="margin-top:19px">Хороший финал — тот, который подходит именно тебе.</p>`;document.getElementById('again').addEventListener('click',()=>{state={turn:0,trust:2,chemistry:2,comfort:2};renderScene()});document.getElementById('restart').addEventListener('click',renderStart)}
let toastTimer;function toast(text){toastEl.textContent=text;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2300)}
renderStart();
</script>
</body>
</html>

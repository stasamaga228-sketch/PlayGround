<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11101a">
<title>After Hours — A grown-up story game</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--ink:#f7f0e9;--muted:#b9afb8;--bg:#11101a;--panel:#1b1925;--pink:#f5a1b5;--gold:#e9c78e;--line:#ffffff20;--mint:#9ed8c3;--shadow:0 24px 80px #08070db0}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 4%,#392535 0,transparent 35%),radial-gradient(ellipse at 4% 92%,#202e34 0,transparent 32%),var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.shell{max-width:1180px;margin:auto;padding:22px clamp(16px,4vw,48px) 36px;min-height:100vh;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:11px;font-size:12px;text-transform:uppercase;letter-spacing:.22em;color:#e3d6d2}.brand-mark{width:32px;height:32px;border:1px solid #e6a1b277;border-radius:50%;display:grid;place-items:center;color:var(--pink);font-family:serif;font-size:19px}.top-note{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b9aab5;border:1px solid var(--line);border-radius:100px;padding:8px 12px}.main{flex:1;display:grid;place-items:center}.game{width:100%;max-width:1050px;min-height:580px;border:1px solid #ffffff1b;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#24212de8,#17151fee);box-shadow:var(--shadow);display:grid;grid-template-columns: .92fr 1.08fr;position:relative}.art{position:relative;min-height:580px;overflow:hidden;background:linear-gradient(180deg,#30273e,#171923 70%)}.art:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 46%,#13121bd9 100%),radial-gradient(ellipse at 50% 30%,#ee9d9a30,transparent 48%)}.moon{position:absolute;width:100px;height:100px;right:15%;top:13%;border-radius:50%;background:#ffe5c7;box-shadow:0 0 42px #fbc9ac55;opacity:.8}.city{position:absolute;bottom:0;left:0;right:0;height:41%;background:repeating-linear-gradient(90deg,transparent 0 7%,#171721 7% 9%,transparent 9% 12%),linear-gradient(0deg,#101119 0 24%,transparent 24%)}.city:before{content:'';position:absolute;inset:35% 0 0;background:repeating-linear-gradient(90deg,#f6bd8244 0 2px,transparent 2px 27px);mask-image:linear-gradient(0deg,#000,transparent)}.roof{position:absolute;bottom:0;left:0;right:0;height:20%;background:linear-gradient(165deg,#262532,#101118 75%);clip-path:polygon(0 26%,100% 0,100% 100%,0 100%)}.plant{position:absolute;bottom:15%;left:10%;width:105px;height:200px;opacity:.85}.plant i{position:absolute;bottom:10px;left:50%;width:4px;height:150px;background:#546f62;transform-origin:bottom;border-radius:4px}.plant i:before{content:'';position:absolute;width:31px;height:58px;background:linear-gradient(135deg,#648c70,#263b3c);border-radius:100% 0 100% 0;top:14px;left:-26px;transform:rotate(-25deg)}.plant i:nth-child(1){transform:rotate(-35deg)}.plant i:nth-child(2){transform:rotate(-15deg);height:180px}.plant i:nth-child(3){transform:rotate(15deg);height:170px}.plant i:nth-child(4){transform:rotate(35deg);height:135px}.table{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);width:190px;height:72px;border-radius:50%;background:linear-gradient(180deg,#39303a,#201d27);border:1px solid #ffffff30;box-shadow:0 13px 15px #0007}.table:after{content:'';position:absolute;width:8px;height:72px;background:#28232d;left:calc(50% - 4px);top:45px}.glass{position:absolute;bottom:30%;left:calc(50% + 33px);width:20px;height:30px;border:1px solid #e7c99caa;border-top:0;border-radius:0 0 7px 7px;z-index:2}.glass:before{content:'';position:absolute;top:7px;left:1px;right:1px;height:1px;background:#e8c995}.glow{position:absolute;bottom:29%;left:calc(50% - 50px);width:14px;height:14px;background:#ffc58c;border-radius:50%;filter:blur(7px);box-shadow:0 0 24px 9px #e9a47585;z-index:2}.figure{position:absolute;bottom:21%;left:50%;transform:translateX(-50%);width:148px;height:260px;z-index:3;transition:filter .4s}.figure .hair{position:absolute;top:1px;left:26px;width:98px;height:126px;border-radius:52% 48% 42% 42%;background:linear-gradient(115deg,#241a27,#523447 57%,#261c28);z-index:2}.figure .face{position:absolute;top:30px;left:43px;width:68px;height:87px;border-radius:45% 45% 48% 48%;background:linear-gradient(100deg,#c98975,#ebba9e 70%,#b87368);z-index:3}.figure .face:after{content:'·  ·';position:absolute;left:19px;top:32px;letter-spacing:13px;font-size:15px;color:#402933}.figure .neck{position:absolute;top:98px;left:68px;width:25px;height:32px;background:#ce917e;z-index:2}.figure .body{position:absolute;top:115px;left:18px;width:112px;height:145px;border-radius:52px 52px 12px 12px;background:linear-gradient(100deg,#594257,#aa6579 55%,#6e4058);z-index:1}.figure .body:after{content:'';position:absolute;top:13px;left:48px;width:1px;height:94px;background:#ffffff30}.figure .hair-back{position:absolute;top:15px;left:22px;width:104px;height:150px;border-radius:50% 50% 26% 26%;background:#362438;z-index:0}.figure .earring{position:absolute;top:91px;left:108px;width:7px;height:15px;border:1px solid var(--gold);border-radius:50%;z-index:4}.figure.smile{filter:drop-shadow(0 0 15px #f2b7ae33)}.art-label{position:absolute;z-index:5;left:28px;bottom:25px}.art-label small{display:block;color:#d4b8b7;text-transform:uppercase;letter-spacing:.2em;font-size:10px;margin-bottom:6px}.art-label strong{font:500 27px 'Playfair Display',serif}.content{padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;justify-content:center;position:relative}.eyebrow{display:flex;align-items:center;gap:9px;color:var(--pink);font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:13px}.eyebrow:before{content:'';width:19px;height:1px;background:currentColor}h1,h2{font-family:'Playfair Display',serif;font-weight:500;line-height:1.13;margin:0}h1{font-size:clamp(36px,5vw,58px);letter-spacing:-.03em}h2{font-size:clamp(28px,4vw,40px)}.intro{color:#c9bdc4;line-height:1.75;font-size:14px;max-width:460px;margin:17px 0 23px}.fine{font-size:11px;color:#9e929c;line-height:1.6}.primary,.choice,.text-button{border:0;cursor:pointer;transition:transform .18s,background .18s,border-color .18s}.primary{background:var(--pink);color:#281821;border-radius:100px;padding:14px 22px;font-weight:700;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 7px 24px #e99cad24}.primary:hover{background:#ffb6c4;transform:translateY(-2px)}.entry-actions{display:flex;align-items:center;gap:17px;flex-wrap:wrap}.text-button{background:none;color:#b9afb8;text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:8px}.text-button:hover{color:white}.age-check{display:flex;gap:10px;align-items:flex-start;margin:3px 0 18px;font-size:12px;color:#c5b8c0;line-height:1.5}.age-check input{accent-color:var(--pink);width:16px;height:16px;margin:1px 0 0}.hidden{display:none!important}.scene-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.chapter{color:#a89ca8;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.turn{color:#9e929c;font-size:11px}.meters{display:flex;gap:9px;margin:4px 0 23px}.meter{flex:1;min-width:0;background:#ffffff08;border:1px solid #ffffff13;border-radius:12px;padding:11px 12px}.meter-head{display:flex;justify-content:space-between;gap:4px;font-size:10px;color:#bfb1bc;margin-bottom:7px}.meter-head b{font-weight:600;color:var(--ink)}.track{height:4px;background:#ffffff15;border-radius:6px;overflow:hidden}.fill{height:100%;width:50%;background:var(--pink);border-radius:6px;transition:width .5s}.fill.trust{background:var(--mint)}.fill.chemistry{background:var(--gold)}.dialogue{font:500 clamp(18px,2.4vw,23px)/1.5 'Playfair Display',serif;color:#f5e8e4;margin:0 0 8px}.narration{font-size:13px;color:#bcb0b8;line-height:1.72;margin:0 0 18px}.prompt{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#c7a6b0;margin:0 0 10px}.choices{display:grid;gap:9px}.choice{width:100%;text-align:left;border:1px solid #ffffff1c;background:#ffffff06;padding:13px 15px;border-radius:12px;line-height:1.45;font-size:13px;color:#e8dfe4;display:flex;align-items:flex-start;gap:11px}.choice:hover{border-color:#f5a1b577;background:#f5a1b50c;transform:translateX(3px)}.choice .num{color:var(--pink);font-size:10px;font-weight:700;min-width:16px;padding-top:2px}.choice small{display:block;color:#a89da6;font-size:11px;margin-top:3px}.statusline{margin-top:16px;min-height:16px;color:#b8d5c9;font-size:11px}.end-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.secondary{border:1px solid #ffffff30;background:#ffffff08;color:#eee0e5;border-radius:100px;padding:12px 17px;cursor:pointer}.secondary:hover{border-color:var(--pink)}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:17px;color:#8e838d;font-size:10px}.footer span:last-child{letter-spacing:.08em}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#292633;border:1px solid #ffffff20;border-radius:100px;padding:10px 15px;font-size:12px;opacity:0;pointer-events:none;transition:.3s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.shell{padding:14px 12px 18px}.topbar{margin-bottom:13px}.game{grid-template-columns:1fr;min-height:0;border-radius:17px}.art{min-height:280px;max-height:34vh}.moon{width:68px;height:68px;top:10%;right:18%}.plant{transform:scale(.7);transform-origin:bottom left;bottom:10%}.figure{transform:translateX(-50%) scale(.72);transform-origin:bottom center;bottom:8%}.table{bottom:8%;transform:translateX(-50%) scale(.75)}.glass{bottom:20%}.glow{bottom:19%}.city{height:52%}.roof{height:24%}.art-label{left:18px;bottom:13px}.art-label strong{font-size:21px}.content{padding:22px 18px 24px}.meters{margin-bottom:17px}.dialogue{font-size:20px}.narration{margin-bottom:13px}.choice{padding:12px}.footer{margin-top:12px}.top-note{font-size:9px;padding:7px 9px}.brand{font-size:10px}.brand-mark{width:28px;height:28px}}
@media(max-width:380px){.meters{gap:5px}.meter{padding:9px 7px}.meter-head{font-size:9px}.content{padding:19px 15px}.art{min-height:240px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="brand"><div class="brand-mark">✦</div> Velvet Hour</div><div class="top-note">A grown-up story · 18+</div></header>
  <main class="main"><section class="game" aria-live="polite">
    <div class="art" aria-label="Illustration of a rooftop lounge at night"><div class="moon"></div><div class="city"></div><div class="roof"></div><div class="plant"><i></i><i></i><i></i><i></i></div><div class="figure" id="figure"><div class="hair-back"></div><div class="hair"></div><div class="face"></div><div class="neck"></div><div class="body"></div><div class="earring"></div></div><div class="table"></div><div class="glass"></div><div class="glow"></div><div class="art-label"><small>Tonight's company</small><strong>Rowan, 29</strong></div></div>
    <div class="content" id="content"></div>
  </section></main>
  <footer class="footer"><span>Fictional adults · consent comes first</span><span>VELVET HOUR&nbsp; / &nbsp;01</span></footer>
</div><div class="toast" id="toast" role="status"></div>
<script>
const content=document.getElementById('content');
const figure=document.getElementById('figure');
const toastEl=document.getElementById('toast');
let state={turn:0,trust:2,chemistry:2,comfort:2};
const startMarkup=`<div class="eyebrow">A little after midnight</div><h1>Some nights<br>are made for<br>getting closer.</h1><p class="intro">A rooftop, a warm drink, and an intriguing stranger. Spend one evening with Rowan in this short, choice-driven story about chemistry, honesty, and the pleasure of taking things at your own pace.</p><label class="age-check"><input type="checkbox" id="adultCheck"><span>I’m 18 or older. I understand this is a fictional, non-explicit romance game.</span></label><div class="entry-actions"><button class="primary" id="begin" disabled>Enter the evening <span aria-hidden="true">↗</span></button><button class="text-button" id="about">What kind of game is this?</button></div><p class="fine" style="margin-top:18px">All characters are adults. No explicit sexual content. Every intimate moment is optional, mutual, and fade-to-black.</p>`;
const chapters=[
 {title:'The first spark',line:'“I’m glad you came. This place is usually my quiet little secret.” Rowan smiles, then gestures to the open seat. “What kind of evening were you hoping for?”',desc:'A breeze carries the scent of jasmine from the terrace planters. Rowan waits, genuinely curious.',prompt:'Set the tone',choices:[
  {label:'“Good conversation and no need to rush.”',sub:'Open, unhurried · builds trust',d:[2,1,2],note:'Rowan relaxes. “That sounds like exactly my speed.”'},
  {label:'“Surprise me. What do you love about this place?”',sub:'Curious and attentive · builds connection',d:[1,2,1],note:'Their eyes brighten as they tell you the story behind the rooftop.'},
  {label:'“I’d like to flirt a little, if you’re into that.”',sub:'Direct, with room for an honest answer',d:[1,2,1],note:'“I am,” Rowan says with a grin. “Thanks for asking.”'}]},
 {title:'A good question',line:'You find an easy rhythm. Rowan tells you they restore old photographs and collect stories from strangers on trains.',desc:'“I like the moments when people stop performing,” they say. “What makes you feel most like yourself?”',prompt:'Share a little',choices:[
  {label:'Talk about a small thing that brings you joy.',sub:'Personal and low-pressure · builds trust',d:[2,1,1],note:'Rowan listens closely, then shares a favorite small joy of their own.'},
  {label:'Ask what they hope to make more time for.',sub:'Thoughtful · deepens connection',d:[1,2,1],note:'Their answer turns into a story neither of you wants to interrupt.'},
  {label:'“I’m enjoying this. Want to sit a little closer?”',sub:'Check in before changing the mood',d:[1,2,2],note:'“Yes, I’d like that.” Rowan shifts closer, leaving plenty of room.'}]},
 {title:'The gentle pause',line:'A quiet song drifts across the rooftop. Rowan’s hand rests near yours on the table—not touching, just close.',desc:'The moment feels full of possibility. There’s no wrong way to meet it.',prompt:'Choose what feels right',choices:[
  {label:'Offer your hand, and let Rowan decide.',sub:'A clear invitation; their choice matters',d:[2,1,2],note:'Rowan meets your hand with theirs. The contact is warm, easy, and mutual.'},
  {label:'Keep talking; the conversation is the good part.',sub:'Connection doesn’t need to hurry',d:[2,1,2],note:'You both laugh. The unhurried moment becomes its own kind of closeness.'},
  {label:'Ask if they’d like to share a slow dance.',sub:'An invitation, never an expectation',d:[1,2,1],note:'“I’d love to.” Rowan stands, and you sway together beneath the city lights.'}]},
 {title:'One more moment',line:'The night has softened around you. Rowan looks at you with a warmth that feels earned, not assumed.',desc:'“I’ve had a lovely time,” they say. “Would you like to keep the evening going, or call it here on a high note?”',prompt:'Your night, your call',choices:[
  {label:'Suggest another date—somewhere in daylight.',sub:'Leave room for what comes next',d:[2,1,2],note:'“I’d really like that,” Rowan says, already smiling at the idea.'},
  {label:'Ask if they’d like to walk a little longer together.',sub:'A little more time, no pressure',d:[1,2,1],note:'Rowan nods. You step out into the cool night side by side.'},
  {label:'Thank them for the evening and say goodnight.',sub:'A lovely ending is a complete ending',d:[2,1,2],note:'“I’m glad we met,” Rowan says. You part with a genuine smile.'}]}
];
function renderStart(){content.innerHTML=startMarkup;const check=document.getElementById('adultCheck'),begin=document.getElementById('begin');check.addEventListener('change',()=>begin.disabled=!check.checked);begin.addEventListener('click',()=>{if(check.checked){state={turn:0,trust:2,chemistry:2,comfort:2};renderScene()}});document.getElementById('about').addEventListener('click',()=>toast('A cozy, consent-first romance story. No explicit scenes.'));}
function renderMeters(){const values=[['Trust',state.trust,'trust'],['Spark',state.chemistry,'chemistry'],['Comfort',state.comfort,'']];return `<div class="meters">${values.map(([name,val,cls])=>`<div class="meter"><div class="meter-head"><span>${name}</span><b>${Math.min(5,val)}/5</b></div><div class="track"><div class="fill ${cls}" style="width:${Math.min(100,val*20)}%"></div></div></div>`).join('')}</div>`}
function renderScene(){const c=chapters[state.turn];figure.classList.toggle('smile',state.chemistry>=4);content.innerHTML=`<div class="scene-top"><span class="chapter">${c.title}</span><span class="turn">${state.turn+1} / ${chapters.length}</span></div>${renderMeters()}<p class="dialogue">${c.line}</p><p class="narration">${c.desc}</p><p class="prompt">${c.prompt}</p><div class="choices">${c.choices.map((choice,i)=>`<button class="choice" data-choice="${i}"><span class="num">0${i+1}</span><span>${choice.label}<small>${choice.sub}</small></span></button>`).join('')}</div><div class="statusline" id="statusline"></div>`;content.querySelectorAll('.choice').forEach(button=>button.addEventListener('click',()=>selectChoice(Number(button.dataset.choice))));}
function selectChoice(index){const c=chapters[state.turn],choice=c.choices[index];state.trust=Math.max(0,Math.min(5,state.trust+choice.d[0]));state.chemistry=Math.max(0,Math.min(5,state.chemistry+choice.d[1]));state.comfort=Math.max(0,Math.min(5,state.comfort+choice.d[2]));figure.classList.toggle('smile',state.chemistry>=4);const line=document.getElementById('statusline');line.textContent=choice.note;content.querySelectorAll('.choice').forEach(b=>b.disabled=true);setTimeout(()=>{state.turn++;state.turn<chapters.length?renderScene():renderEnding()},1050)}
function renderEnding(){let title,copy,extra;if(state.trust>=7&&state.comfort>=7&&state.chemistry>=7){title='A night to remember';copy='Under the soft glow of the city, you share a lingering, mutual kiss. When the evening ends, it ends gently—on your terms, with a promise to meet again. The rest of the story belongs to you.';extra='A rare kind of chemistry: warm, honest, and entirely your own.'}else if(state.trust>=7&&state.comfort>=6){title='Easy does it';copy='You trade numbers and make a plan for another evening. Nothing has to happen all at once; the promise of getting to know each other is more than enough for tonight.';extra='Trust made room for something lovely to grow.'}else if(state.chemistry>=6){title='A bright little spark';copy='You share a playful goodbye and leave the door open for another time. Whatever this becomes, you both got to choose it—one honest moment at a time.';extra='A spark is a beginning, not a promise.'}else{title='A lovely evening';copy='You say goodnight feeling lighter than when you arrived. Not every connection needs to turn into a romance; sometimes a kind conversation is the whole gift.';extra='You made the evening your own.'}figure.classList.toggle('smile',state.chemistry>=5);content.innerHTML=`<div class="eyebrow">The evening comes to a close</div><h2>${title}</h2><p class="intro">${copy}</p><p class="fine">${extra}</p>${renderMeters()}<div class="end-actions"><button class="primary" id="again">Play again <span aria-hidden="true">↻</span></button><button class="secondary" id="restart">Back to the beginning</button></div><p class="fine" style="margin-top:19px">Every ending is a good ending when it feels right to you.</p>`;document.getElementById('again').addEventListener('click',()=>{state={turn:0,trust:2,chemistry:2,comfort:2};renderScene()});document.getElementById('restart').addEventListener('click',renderStart)}
let toastTimer;function toast(text){toastEl.textContent=text;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2300)}
renderStart();
</script>
</body>
</html>
